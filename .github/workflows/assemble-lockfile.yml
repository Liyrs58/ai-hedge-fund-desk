name: assemble-lockfile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-lockfile.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit full package-lock.json
        run: |
          set -euo pipefail
          cat .github/lock-b64/00.b64 .github/lock-b64/01.b64 .github/lock-b64/02.b64 .github/lock-b64/03.b64 .github/lock-b64/04.b64 .github/lock-b64/05.b64 .github/lock-b64/06.b64 .github/lock-b64/07.b64 .github/lock-b64/08.b64 .github/lock-b64/09.b64 | tr -d '\n' | base64 -d | gzip -dc > package-lock.json
          SIZE=$(wc -c < package-lock.json)
          echo "size=$SIZE"
          test "$SIZE" -eq 406128
          grep -q '"lockfileVersion": 3' package-lock.json
          RESOLVED=$(grep -c '"resolved"' package-lock.json)
          echo "resolved=$RESOLVED"
          test "$RESOLVED" -eq 742
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -r .github/lock-b64
          git rm .github/workflows/assemble-lockfile.yml
          git commit -m "Replace stub package-lock with full lockfile"
          git push
