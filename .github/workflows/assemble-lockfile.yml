name: assemble-lockfile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-lockfile.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit full package-lock.json
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, gzip
          ids = ['00','01','02','03','04','05','06','07','08','09']
          s = ''.join(Path(f'.github/lock-b64/{i}.b64').read_text().replace('\n','') for i in ids)
          repls = [
            ('oc9gb83Vpbty3iPV8','oc9gb83Vvbty3iPV8'),
            ('oi95b4AzpxMLa2Yvg','oi95b4AzvxMLa2Yvg'),
            ('Q0j4DQXvltp9Cxqi7','Q0j4DQXvrtp9Cxqi7'),
            ('JWJ3wTw9lfI5CZ75C','JWJ3wTw9rfI5CZ75C'),
            ('DX9B9F9/lsUCEuF/s','DX9B9F9/rsUCEuF/s'),
            ('E+UVqvPdBek7DeUDA','E+UVqvPdbek7DeUDA'),
            ('Lq4oM0r853vyvFC48','Lq4oM0r893vyvFC48'),
          ]
          for a,b in repls:
              n = s.count(a)
              assert n == 1, (a, n)
              s = s.replace(a, b, 1)
          raw = gzip.decompress(base64.b64decode(s))
          assert len(raw) == 406128, len(raw)
          text = raw.decode()
          assert '"lockfileVersion": 3' in text
          assert text.count('"resolved"') == 742
          Path('package-lock.json').write_bytes(raw)
          print('ok', len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -r .github/lock-b64
          git rm .github/workflows/assemble-lockfile.yml
          git commit -m "Replace stub package-lock with full lockfile"
          git push
